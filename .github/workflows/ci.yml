name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm validate:catalog

  build-and-e2e:
    name: Build games, site and end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    env:
      ROGUE_ARCHIVE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each game's runtime is cached under a hash of everything that builds or
      # verifies it (its directory, minus docs and output, and the toolchain).
      # A push that does not touch a game reuses its runtime and skips its
      # build and engine conformance, which already passed for those inputs.
      # Each runtime is saved as soon as its own build and conformance pass,
      # so a later failure (end-to-end tests) doesn't discard it.
      - name: Restore Brogue CE runtime
        id: brogue
        uses: actions/cache/restore@v4
        with:
          path: games/brogue-ce/dist
          key: runtime-brogue-ce-${{ runner.os }}-${{ hashFiles('tools/toolchain.env', 'tools/ensure-emsdk.sh', 'tools/write-runtime-manifest.mjs', 'games/brogue-ce/**', '!games/brogue-ce/dist/**', '!games/brogue-ce/node_modules/**', '!games/brogue-ce/**/*.md') }}
      - name: Restore DCSS runtime
        id: dcss
        uses: actions/cache/restore@v4
        with:
          path: games/dcss/dist
          key: runtime-dcss-${{ runner.os }}-${{ hashFiles('tools/toolchain.env', 'tools/ensure-emsdk.sh', 'tools/write-runtime-manifest.mjs', 'games/dcss/**', '!games/dcss/dist/**', '!games/dcss/node_modules/**', '!games/dcss/**/*.md') }}
      - name: Restore Sil-Q runtime
        id: sil
        uses: actions/cache/restore@v4
        with:
          path: games/sil-q/dist
          key: runtime-sil-q-${{ runner.os }}-${{ hashFiles('tools/toolchain.env', 'tools/ensure-emsdk.sh', 'tools/write-runtime-manifest.mjs', 'games/sil-q/**', '!games/sil-q/dist/**', '!games/sil-q/node_modules/**', '!games/sil-q/**/*.md') }}
      - name: Restore Rogue runtime
        id: rogue
        uses: actions/cache/restore@v4
        with:
          path: games/rogue/dist
          key: runtime-rogue-${{ runner.os }}-${{ hashFiles('tools/toolchain.env', 'tools/ensure-emsdk.sh', 'tools/write-runtime-manifest.mjs', 'games/rogue/**', '!games/rogue/dist/**', '!games/rogue/node_modules/**', '!games/rogue/**/*.md') }}
      - name: Cache Emscripten SDK
        if: steps.brogue.outputs.cache-hit != 'true' || steps.dcss.outputs.cache-hit != 'true' || steps.sil.outputs.cache-hit != 'true' || steps.rogue.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/rogue-archive/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/toolchain.env') }}
      - name: Build Brogue CE runtime
        if: steps.brogue.outputs.cache-hit != 'true'
        run: pnpm build:brogue
      - name: Brogue CE engine conformance (seed catalogs, native vs WASM replay, key coverage)
        if: steps.brogue.outputs.cache-hit != 'true'
        run: pnpm test:engine
      - name: Save Brogue CE runtime (built and verified)
        if: steps.brogue.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: games/brogue-ce/dist
          key: ${{ steps.brogue.outputs.cache-primary-key }}
      - name: Install DCSS host build tools
        if: steps.dcss.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml libpng-dev libncurses-dev clang libc++-dev libc++abi-dev
      - name: Cache DCSS build tree
        if: steps.dcss.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/rogue-archive/dcss
          key: dcss-${{ runner.os }}-${{ hashFiles('tools/toolchain.env', 'games/dcss/upstream.env', 'games/dcss/scripts/build.sh', 'games/dcss/port/**') }}
          # Upstream's Makefile rebuilds whatever a changed flag or source affects.
          restore-keys: dcss-${{ runner.os }}-
      - name: Build DCSS runtime
        if: steps.dcss.outputs.cache-hit != 'true'
        run: pnpm build:dcss
      - name: DCSS engine conformance (key coverage, upstream drift, native vs WASM replay)
        if: steps.dcss.outputs.cache-hit != 'true'
        run: pnpm test:engine:dcss
      - name: Save DCSS runtime (built and verified)
        if: steps.dcss.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: games/dcss/dist
          key: ${{ steps.dcss.outputs.cache-primary-key }}
      - name: Build Sil-Q runtime
        if: steps.sil.outputs.cache-hit != 'true'
        run: pnpm build:sil
      - name: Sil-Q engine conformance (key coverage, native vs WASM replay)
        if: steps.sil.outputs.cache-hit != 'true'
        run: pnpm test:engine:sil
      - name: Save Sil-Q runtime (built and verified)
        if: steps.sil.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: games/sil-q/dist
          key: ${{ steps.sil.outputs.cache-primary-key }}
      - name: Build Rogue runtime
        if: steps.rogue.outputs.cache-hit != 'true'
        run: pnpm build:rogue
      - name: Rogue engine conformance (key coverage, native vs WASM replay)
        if: steps.rogue.outputs.cache-hit != 'true'
        run: pnpm test:engine:rogue
      - name: Save Rogue runtime (built and verified)
        if: steps.rogue.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: games/rogue/dist
          key: ${{ steps.rogue.outputs.cache-primary-key }}
      - name: Report runtime sizes
        run: |
          echo "### Runtime sizes" >> "$GITHUB_STEP_SUMMARY"
          for manifest in games/*/dist/runtime-manifest.json; do
            node -e 'const m=require("./"+process.argv[1]);const t=m.files.reduce((s,f)=>s+f.size,0);console.log(`- ${m.gameId} ${m.buildId}: ${(t/1048576).toFixed(2)} MB`)' "$manifest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Build site
        run: pnpm validate:catalog && node tools/stage-runtimes.mjs --strict && pnpm --filter @rogue-archive/web build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
