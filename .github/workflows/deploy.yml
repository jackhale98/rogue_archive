name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROGUE_ARCHIVE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/rogue-archive/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/toolchain.env') }}
      - run: pnpm test
      - run: pnpm build:brogue
      - name: Install DCSS host build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml libpng-dev
      - name: Cache DCSS build tree
        uses: actions/cache@v4
        with:
          path: ~/.cache/rogue-archive/dcss
          key: dcss-${{ runner.os }}-${{ hashFiles('tools/toolchain.env', 'games/dcss/upstream.env', 'games/dcss/scripts/build.sh', 'games/dcss/port/**') }}
          # Upstream's Makefile rebuilds whatever a changed flag or source affects.
          restore-keys: dcss-${{ runner.os }}-
      - name: Build DCSS runtime
        run: pnpm build:dcss
        env:
          ROGUE_ARCHIVE_HARNESS: '0'
      - name: Build Sil-Q runtime
        run: pnpm build:sil
        env:
          ROGUE_ARCHIVE_HARNESS: '0'
      - run: pnpm validate:catalog && node tools/stage-runtimes.mjs --strict && pnpm --filter @rogue-archive/web build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
