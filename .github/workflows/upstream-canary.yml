name: Upstream canary

# Weekly early warning: does each port still build, play and pass its tests
# against its game's newest release and development branch? This never changes
# what is deployed; updating the pin stays a deliberate, reviewed change
# (docs/contributing/updating-a-game.md).
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: ${{ matrix.game }} ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [brogue-ce, dcss, sil-q, rogue]
        ref: [latest-release, master]
    env:
      ROGUE_ARCHIVE_UPSTREAM_REF: ${{ matrix.ref }}
      ROGUE_ARCHIVE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rogue-archive/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('tools/toolchain.env') }}
      - name: Host build tools (DCSS)
        if: matrix.game == 'dcss'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml libpng-dev libncurses-dev clang libc++-dev libc++abi-dev
      - name: Build against upstream ${{ matrix.ref }}
        run: games/${{ matrix.game }}/scripts/build.sh
      - name: Engine conformance and upstream drift
        run: games/${{ matrix.game }}/scripts/test-engine.sh
      - name: Build site
        # Only this game is built here, so other games' runtimes are absent (not --strict).
        run: node tools/stage-runtimes.mjs && pnpm --filter @rogue-archive/web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (this game)
        run: pnpm e2e e2e/${{ matrix.game == 'brogue-ce' && 'brogue' || matrix.game }}
